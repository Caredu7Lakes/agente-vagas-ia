name: Executar Agente de Vagas IA

on:
  schedule:
    - cron: '17 11,14,17,20 * * 1-5'   # 08h, 11h, 14h e 17h BRT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agente-vagas
  cancel-in-progress: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar secrets
        env:
          EMAIL_USER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "import os,sys; f=[k for k in ('EMAIL_USER','EMAIL_PASS','OPENAI_API_KEY') if not os.getenv(k)]; sys.exit(f'secrets faltando: {f}' if f else 0)"

      - name: Restaurar currículos
        env:
          CV_BACK_B64: ${{ secrets.CV_BACK_B64 }}
          CV_ENG_B64: ${{ secrets.CV_ENG_B64 }}
        run: |
          mkdir -p assets
          echo "$CV_BACK_B64" | base64 -d > assets/curriculo_back.docx
          echo "$CV_ENG_B64"  | base64 -d > assets/curriculo_eng.docx
          ls -la assets/

      - name: Executar Agente de Vagas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_IMAP_SERVER: ${{ secrets.EMAIL_IMAP_SERVER }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python -m src.main

      - name: Executar Agente Candidato
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_IMAP_SERVER: ${{ secrets.EMAIL_IMAP_SERVER }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
        run: python -m src.main_applicant

      - name: Salvar histórico do vagas.db
        if: always()
        run: |
          if [ ! -f vagas.db ]; then
            echo "vagas.db não existe — nada a commitar."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vagas.db
          git diff --staged --quiet && exit 0
          git commit -m "chore: atualiza banco de vagas [skip ci]"
          git pull --rebase --autostash
          git push