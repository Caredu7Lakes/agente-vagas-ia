name: Executar Agente de Vagas IA

on:
  schedule:
    # Roda de segunda a sexta às 08:00 e 17:00 (Horário de Brasília / UTC-3 -> 12:00 e 20:00 UTC)
    - cron: '0 12,20 * * 1-5'
  workflow_dispatch: # Permite disparar manualmente pelo site do GitHub quando você quiser

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Agente de Vagas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python src/main.py

      - name: Salvar histórico do banco vagas.db no Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vagas.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: atualiza banco de vagas [skip ci]" && git push)